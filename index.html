      <li>متفرغ جزئيًا أو دارس ← <b>(20)</b> · مكلَّف بالتدريس أو عقد 315 / أجر يومي ← <b>(26)</b> · مشمول بقانون ذوي الإعاقة ← <b>(25)</b>.</li>
      <li>موظف ← <b>(28)</b> · مهني أو حرفي ← <b>(29)</b>.</li>
    </ul></section></div>`;
}
function group(key){
  const g=GROUPS[key];
  app.innerHTML=`<div class="wrap ${g.cls}" style="gap:16px">
    <button class="back" data-go="">→ العودة إلى الصفحة الرئيسية</button>
    <h2 style="font-size:24px">${g.title}</h2>
    <div class="list">${g.ids.map(id=>card(id)).join('')}</div></div>`;
}
function card(id){
  const f=FORMS[id],r=REQ[id];
  const reqHtml=r?`<ol>${r.map(x=>`<li>${x}</li>`).join('')}</ol>
      <div class="note">فقرات التقييم التي يضع درجتها المسؤول المباشر أو اللجنة، ورأي الطالب (تُدخله شعبة ضمان الجودة)، لا تحتاج منك إرفاقًا. أرفق كذلك استمارة التعهد الخطي.</div>`
    :`<div class="note" style="margin:0">قائمة المتطلبات التفصيلية لهذه الاستمارة قيد الإعداد — راجع شعبة ضمان الجودة، وأرفق عمومًا ما يثبت كل فقرة تطالب بها في الاستمارة مع التعهد الخطي.</div>`;
  return `<article class="form"><div class="num"><small>استمارة</small><strong>${id}</strong></div>
    <h3>${f.t}</h3><div class="full">${f.full}</div><div class="who"><b>المشمول بها: </b>${f.who}</div>
    <div class="actions"><a class="btn pri" href="${f.url}" target="_blank" rel="noopener">تحميل الاستمارة</a>
      <button class="btn sec" id="rb${id}" data-req="${id}" aria-expanded="false">قائمة المتطلبات</button></div>
    <div class="req" id="rq${id}" hidden><b>الوثائق المطلوب إرفاقها:</b>${reqHtml}</div></article>`;
}
function route(){const h=location.hash.slice(1);GROUPS[h]?group(h):home();window.scrollTo(0,0)}
app.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){const k=go.dataset.go;if(k)location.hash=k;else{history.pushState('',document.title,location.pathname);route()}return}
  const rb=e.target.closest('[data-req]');
  if(rb){const p=document.getElementById('rq'+rb.dataset.req);p.hidden=!p.hidden;rb.setAttribute('aria-expanded',String(!p.hidden))}
});
window.addEventListener('hashchange',route);
route();
</script></body>

</html>
